{% extends "base.html" %}
{% block lab %}РГЗ{% endblock %}

{% block main %}
<style>
    body {
        background-color: #dec756c7;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }
    .container {
        width: 80%;
        margin: auto;
        overflow: hidden;
    }
    .product-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    }
    .product-table td {
        border: 1px solid #aa9703;
				background-color: #ffec99c7;
        padding: 12px;
        text-align: center;
    }	
    .product-image {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 8px;
    }
    .product-table button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 10px 20px;
        text-align: center;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 12px;
        transition: background-color 0.3s ease;
    }
    .product-table button:hover {
        background-color: #45a049;
    }
    .welcome-message {
        text-align: center;
        margin: 20px 0;
        font-size: 1.2em;
    }
    .action-buttons {
        text-align: center;
        margin: 20px 0;
    }
    .action-buttons button {
        background-color: #008CBA;
        color: white;
        border: none;
        padding: 10px 20px;
        text-align: center;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 12px;
        transition: background-color 0.3s ease;
    }
    .action-buttons button:hover {
        background-color: #007bb5;
    }
</style>

<div class="container">
    {% if login %}
    {% for mab in mabel %}
    <table class="product-table">
        <tbody>
            <tr>
                <td>{{ mab.name }}</td>
            </tr>
            <tr>
                <td><img src="{{ mab.photo }}" class="product-image"></td>
            </tr>
            <tr>
                <td>{{ mab.price }}р</td>
                <td>
                    <form action="/kononov_rgz/add_car" method="post">
                        <input type="hidden" name="car1" value="{{ mab.name }}">
                        <input type="hidden" name="car2" value="{{ mab.price }}">
                        <input type="hidden" name="car3" value="{{ mab.photo }}">
                        <input type="hidden" name="car4" value="{{ login }}">
                        <button type="submit">Добавить в корзину</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    {% endfor %}
    <div class="welcome-message">Добро пожаловать, {{ login }}!</div>
    <div class="action-buttons">
        <form action="/kononov_rgz/logout" method="post">
            <button type="submit">Выйти</button>
        </form>
        <form action="/kononov_rgz/car" method="post">
            <input type="hidden" name="car1" value="{{ login }}">
            <button type="submit">Корзина</button>
        </form>
        <form action="/kononov_rgz/registration" method="get">
            <button type="submit">Регистрация</button>
        </form>
    </div>
    {% else %}
    {% for mab in mabel %}
    <table class="product-table">
        <tbody>
            <tr>
                <td>{{ mab.name }}</td>
            </tr>
            <tr>
                <td><img src="{{ mab.photo }}" class="product-image"></td>
            </tr>
            <tr>
                <td>{{ mab.price }}р</td>
            </tr>
        </tbody>
    </table>
    {% endfor %}
    <div class="action-buttons">
        <form action="/kononov_rgz/login" method="get">
            <button type="submit">Авторизоваться</button>
        </form>
        <form action="/kononov_rgz/registration" method="get">
            <button type="submit">Регистрация</button>
        </form>
    </div>
    {% endif %}
</div>
{% endblock %}
