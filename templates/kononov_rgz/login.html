{% extends "base.html" %}
{% block lab %}РГЗ{% endblock %}

{% block main %}
<style>
	    html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #dec756c7; 
    }
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh; 
    }
    .login-form {
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        width: 300px;
    }
    .login-form label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .login-form input[type="text"],
    .login-form input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    .login-form button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 10px 20px;
        text-align: center;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 12px;
        transition: background-color 0.3s ease;
    }
    .login-form button:hover {
        background-color: #45a049;
    }
    .error-message {
        color: red;
        margin-top: 10px;
        text-align: center;
    }
</style>

<div class="container">
    <div class="login-form">
        <form action="/kononov_rgz/login" method="post">
            <label>Логин:</label>
            <input type="text" name="login" required><br>
            <label>Пароль:</label>
            <input type="password" name="password" required><br>
            <button type="submit">Авторизоваться</button>
            {% if error %}
                <div class="error-message">{{ error }}</div>
            {% endif %}
        </form>
    </div>
</div>
{% endblock %}
